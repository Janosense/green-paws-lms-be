# course-import: uploads/vl-lms-import/<token>/ holds an uploaded course between its
# preview and its confirmation. PHP reads it from disk; nothing fetches it over HTTP.
# The .htaccess in each folder is inert on nginx. `^~` stops the image regex
# location from serving assets/.
location ^~ /wp-content/uploads/vl-lms-import/ {
    deny all;
}
